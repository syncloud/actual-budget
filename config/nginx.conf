pid /var/snap/actual-budget/current/nginx.pid;
daemon off;
worker_processes auto;

error_log syslog:server=unix:/dev/log warn;

events {
    worker_connections 1024;
}

http {
    access_log syslog:server=unix:/dev/log;
    include /snap/actual-budget/current/nginx/etc/nginx/mime.types;

    client_body_temp_path /var/snap/actual-budget/current/nginx/client_body_temp;
    proxy_temp_path /var/snap/actual-budget/current/nginx/proxy_temp;
    fastcgi_temp_path /var/snap/actual-budget/current/nginx/fastcgi_temp;
    uwsgi_temp_path /var/snap/actual-budget/current/nginx/uwsgi_temp;
    scgi_temp_path /var/snap/actual-budget/current/nginx/scgi_temp;

    client_max_body_size 0;

    upstream actual {
        server 127.0.0.1:5006;
    }

    server {
        listen unix:/var/snap/actual-budget/common/web.socket;

        set_real_ip_from unix:;
        server_name localhost;

        location / {
            proxy_pass http://actual;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
